name: 'Create MIDI Ports (Windows)'
description: 'Creates virtual MIDI ports on Windows'

inputs:
  enabled:
    description: 'Whether to run this action'
    required: false
    default: 'true'
  ports-names: 
    description: 'Comma-separated list of port names'
    required: false
    default: 'MIDI A,MIDI B,MIDI C'
  arch: 
    description: 'Utility architecture'
    required: false
    default: 'x64'

runs:
  using:  'composite'
  steps:    
    - name: Create virtual MIDI ports (Windows)
      if: inputs.enabled == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        & "${{ github.workspace }}/Resources/Scripts/Setup MIDI ports.ps1" -portsNames "${{ inputs.ports-names }}" -arch "${{ inputs.arch }} -"