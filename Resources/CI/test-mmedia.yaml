trigger:
  batch: true
  branches:
    include:
    - master
    - develop
  paths:
    include:
    - 'DryWetMidi/*'
    - 'DryWetMidi.Tests/*'
    - 'DryWetMidi.Tests.Common/*'
    - 'Resources/CI/test-mmedia.yaml'
    - 'Resources/CI/Templates/stage-build-native-libs.yaml'
    - 'Resources/CI/Templates/step-create-ports-windows.yaml'
    - 'Resources/CI/Templates/step-create-ports-macos.yaml'
    - 'Resources/CI/Templates/step-copy-native-libraries-near-csproj.yaml'
    - 'Resources/CI/Templates/step-collect-logs.yaml'
    - 'Resources/CI/Templates/step-build-tests.yaml'
    - 'Resources/CI/Templates/step-setup-framework-variables.yaml'
    - 'Resources/CI/Templates/step-build-tests.yaml'
    - 'Resources/CI/Templates/step-build-test-data-sending-utility'
    - 'Resources/Utilities/CreateLoopbackPort_Windows/*'
    - 'Resources/Utilities/CreateLoopbackPort_macOS/*'
    - 'Resources/Scripts/Setup MIDI ports.ps1'
    - 'Resources/Native/*'

pr:
  branches:
    include:
    - develop
  paths:
    include:
    - 'DryWetMidi/*'
    - 'DryWetMidi.Tests/*'
    - 'DryWetMidi.Tests.Common/*'
    - 'Resources/CI/test-mmedia.yaml'
    - 'Resources/CI/Templates/stage-build-native-libs.yaml'
    - 'Resources/CI/Templates/step-create-ports-windows.yaml'
    - 'Resources/CI/Templates/step-create-ports-macos.yaml'
    - 'Resources/CI/Templates/step-copy-native-libraries-near-csproj.yaml'
    - 'Resources/CI/Templates/step-collect-logs.yaml'
    - 'Resources/CI/Templates/step-build-tests.yaml'
    - 'Resources/CI/Templates/step-setup-framework-variables.yaml'
    - 'Resources/CI/Templates/step-build-tests.yaml'
    - 'Resources/CI/Templates/step-build-test-data-sending-utility'
    - 'Resources/Utilities/CreateLoopbackPort_Windows/*'
    - 'Resources/Utilities/CreateLoopbackPort_macOS/*'
    - 'Resources/Scripts/Setup MIDI ports.ps1'
    - 'Resources/Native/*'

variables:
- group: DryWetMIDI-Common-Variables

name: TestMultimedia_$(SourceBranchName)_$(LibraryVersion)$(Rev:.r)

stages:
- template: Templates/stage-build-native-libs.yaml

- stage: RunTests
  displayName: Run tests
  jobs:
  - job: RunTests
    displayName: Run tests
    strategy:
      matrix:
        Windows_Net:
          vmImage: 'windows-latest'
          framework: 'Net'
        Windows_NetFramework:
          vmImage: 'windows-latest'
          framework: 'NetFramework'
        macOS_Net:
          vmImage: 'macos-latest'
          framework: 'Net'
        macOS_Arm_Net:
          vmImage: 'macOS-15-arm64'
          framework: 'Net'
    pool:
      vmImage: $(vmImage)
    steps:
    - template: Templates/step-copy-native-libraries-near-csproj.yaml
    
    - template: Templates/step-setup-framework.yaml
      parameters:
        framework: '$(framework)'
    
    - template: Templates/step-build-tests.yaml
      parameters:
        tfm: '$(Tfm)'
    
    - template: Templates/step-build-test-data-sending-utility.yaml
    
    - template: Templates/step-create-ports-windows.yaml
      parameters:
        enabled: contains(variables.vmImage, 'windows')
    
    - template: Templates/step-create-ports-macos.yaml
      parameters:
        enabled: contains(variables.vmImage, 'macos')
    
    - task: DotNetCoreCLI@2
      displayName: Run unit tests
      continueOnError: false
      timeoutInMinutes: 60
      inputs:
        command: 'test'
        projects: 'DryWetMidi.Tests/Melanchall.DryWetMidi.Tests.csproj'
        arguments: '--blame --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full --no-build --configuration $(TestBuildConfiguration) --filter (FullyQualifiedName~.Multimedia) --framework $(Tfm) --verbosity normal --diag diagnostic.log --logger "console;verbosity=normal" -property:SolutionDir="$(Build.SourcesDirectory)/"'
        
    - template: Templates/step-collect-logs.yaml
      parameters:
        suffix: '_$(vmImage)_$(framework)'
    
    - task: PublishPipelineArtifact@1
      displayName: Publish 'PlaybackTraces' artifact
      condition: failed()
      continueOnError: true
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)/PlaybackTraces
        artifact: 'PlaybackTraces_$(vmImage)_$(framework)_Attempt$(System.JobAttempt)'
        
    - task: PublishPipelineArtifact@1
      displayName: Publish 'SysExTraces' artifact
      condition: failed()
      continueOnError: true
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)/SysExTraces
        artifact: 'SysExTraces_$(vmImage)_$(framework)_Attempt$(System.JobAttempt)'
        
  - job: RunTestsOnHome
    displayName: Run tests on home agents
    pool:
      name: 'Home agents'
    steps:
    - template: Templates/step-copy-native-libraries-near-csproj.yaml
    
    - template: Templates/step-build-tests.yaml
      parameters:
        tfm: 'net10.0'
    
    - task: DotNetCoreCLI@2
      displayName: Run unit tests
      continueOnError: false
      timeoutInMinutes: 60
      inputs:
        command: 'test'
        projects: 'DryWetMidi.Tests/Melanchall.DryWetMidi.Tests.csproj'
        arguments: '--blame --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full --no-build --configuration $(TestBuildConfiguration) --filter (FullyQualifiedName~.Multimedia) --framework net10.0 --verbosity normal --diag diagnostic.log --logger "console;verbosity=normal" -property:SolutionDir="$(Build.SourcesDirectory)/"'
        
    - template: Templates/step-collect-logs.yaml
      parameters:
        suffix: '_$(vmImage)_$(framework)'
    
    - task: PublishPipelineArtifact@1
      displayName: Publish 'PlaybackTraces' artifact
      condition: failed()
      continueOnError: true
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)/PlaybackTraces
        artifact: 'PlaybackTraces_HomeAgents_net10.0_Attempt$(System.JobAttempt)'
        
    - task: PublishPipelineArtifact@1
      displayName: Publish 'SysExTraces' artifact
      condition: failed()
      continueOnError: true
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/$(Build.BuildId)/SysExTraces
        artifact: 'SysExTraces_HomeAgents_net10.0_Attempt$(System.JobAttempt)'
