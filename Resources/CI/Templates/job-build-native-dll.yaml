parameters:
- name: configuration
  displayName: 'Build configuration'
  type: string
- name: artifactName
  displayName: 'Artifact name'
  type: string

jobs:
- job: BuildDll${{ parameters.configuration }}
  displayName: 'Build dll (${{ parameters.configuration }})'
  pool:
    vmImage: 'windows-latest'
  steps:
  - task: PowerShell@2
    displayName: 'Download Windows.Devices.Midi2.nupkg'
    inputs:
      targetType: 'inline'
      script: |
        $packageUrl = "https://github.com/microsoft/MIDI/releases/download/inbox-dev-preview-1/Windows.Devices.Midi2.0.99.30-devpreview.1.nupkg"
        $downloadFolder = "$(Pipeline.Workspace)\Midi2"
        
        New-Item -Path $downloadFolder -ItemType Directory -Force | Out-Null
        
        $fileName = Split-Path $packageUrl -Leaf
        $destinationPath = Join-Path $downloadFolder $fileName
        
        Write-Host "Downloading package from: $packageUrl"
        Write-Host "Saving to: $destinationPath"
        
        Invoke-WebRequest -Uri $packageUrl -OutFile $destinationPath
        Write-Host "Download complete. Package saved to: $destinationPath"

  - task: NuGetCommand@2
    displayName: 'Restore NuGet packages'
    inputs:
      command: 'custom'
      arguments: 'restore "Resources/Native/Windows/Melanchall.DryWetMidi.Native.Windows/Melanchall.DryWetMidi.Native.Windows/Melanchall.DryWetMidi.Native.Windows.vcxproj" -Source "$(Pipeline.Workspace)\Midi2" -Source "https://api.nuget.org/v3/index.json" -SolutionDirectory "$(Build.SourcesDirectory)/Resources/Native/Windows/Melanchall.DryWetMidi.Native.Windows"'
  
  - task: PowerShell@2
    displayName: 'Fix Windows.Devices.Midi2 ARM64EC folder link'
    inputs:
      targetType: 'inline'
      script: |
        $packageRuntimesDir = "$(Build.SourcesDirectory)\Resources\Native\Windows\Melanchall.DryWetMidi.Native.Windows\packages\Windows.Devices.Midi2.0.99.30-devpreview.1\runtimes"
        $srcFolder = "$packageRuntimesDir\win-arm64"
        $dstFolder = "$packageRuntimesDir\win-ARM64EC"
        
        Write-Host "Checking paths..."
        if (Test-Path $srcFolder) {
            if (-not (Test-Path $dstFolder)) {
                New-Item -ItemType Junction -Path $dstFolder -Value $srcFolder
                Write-Host "Successfully linked $srcFolder to $dstFolder"
            } else {
                Write-Host "Destination folder already exists."
            }
        } else {
            Write-Error "Source folder $srcFolder not found! Make sure NuGet restore step has completed successfully."
        }
  
  - task: VSBuild@1
    displayName: 'Build dll'
    inputs:
      solution: 'Resources/Native/Windows/Melanchall.DryWetMidi.Native.Windows/Melanchall.DryWetMidi.Native.Windows/Melanchall.DryWetMidi.Native.Windows.vcxproj'
      platform: '${{ parameters.configuration }}'
      configuration: 'Release'
      msbuildArgs: '/p:SolutionDir=$(Build.SourcesDirectory)\Resources\Native\Windows\Melanchall.DryWetMidi.Native.Windows\'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish dll artifact'
    inputs:
      targetPath: 'Resources\Native\Windows\Melanchall_DryWetMidi_Native.dll'
      artifactName: '${{ parameters.artifactName }}'
      artifactType: pipeline

  - task: PublishPipelineArtifact@1
    displayName: 'Publish pdb artifact'
    inputs:
      targetPath: 'Resources\Native\Windows\Melanchall_DryWetMidi_Native.pdb'
      artifactName: '${{ parameters.artifactName }}_pdb'
      artifactType: pipeline