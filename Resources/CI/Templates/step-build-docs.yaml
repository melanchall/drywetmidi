steps:
- task: PowerShell@2
  displayName: Install docfx
  inputs:
    targetType: 'inline'
    script: dotnet tool install -g docfx --version $(DocFxVersion)

- task: PowerShell@2
  displayName: Setup year
  inputs:
    targetType: 'inline'
    script: |
      $filePath = Resolve-Path "Docs\docfx.json"
      $content = Get-Content $filePath -Raw
      Set-Content $filePath -Value ($content -replace '0000', (Get-Date).Year)

- task: PowerShell@2
  displayName: Build docs
  inputs:
    targetType: 'inline'
    script: docfx Docs/docfx.json

- task: PowerShell@2
  displayName: Fix sitemap.xml
  inputs:
    targetType: 'inline'
    script: |
      [xml]$xml = Get-Content Docs/_site/sitemap.xml
      $node = $xml.urlset.url | Where-Object { $_.loc -like "*404.html*" }
      if ($node) {
        $xml.urlset.RemoveChild($node) > $null
        $xml.Save("$pwd/Docs/_site/sitemap.xml")
      }