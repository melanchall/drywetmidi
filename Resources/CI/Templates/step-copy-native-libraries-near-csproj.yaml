parameters:
- name: winArch
  displayName: 'Windows dll architecture'
  type: string
  default: 'x64'
- name: macosArch
  displayName: 'macOS dylib architecture'
  type: string
  default: 'x64_arm64'

steps:
- task: DownloadPipelineArtifact@2
  displayName: Download native libraries
  inputs:
    source: 'current'
    path: '$(Pipeline.Workspace)/NativeLibraries'

- task: PowerShell@2
  displayName: Copy native libraries near csproj
  inputs:
    targetType: 'inline'
    script: |
      Copy-Item -Path "$(Pipeline.Workspace)/NativeLibraries/Native_Win_${{ parameters.winArch }}/*.dll" -Destination "DryWetMidi" -Verbose
      Copy-Item -Path "$(Pipeline.Workspace)/NativeLibraries/Native_macOS_${{ parameters.macosArch }}/*.dylib" -Destination "DryWetMidi" -Verbose