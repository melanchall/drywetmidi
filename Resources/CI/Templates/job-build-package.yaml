parameters:
- name: prereleaseNumber
  displayName: 'Pre-release number'
  type: string
  default: ''
- name: packageType
  displayName: 'Package type'
  type: string

jobs:
- job: BuildPackage
  displayName: Build package
  pool:
    vmImage: 'windows-latest'
  steps:
  - task: DownloadPipelineArtifact@2
    displayName: Download native libraries
    condition: eq('${{ parameters.packageType }}', 'Full')
    inputs:
      source: 'current'
      path: '$(Pipeline.Workspace)\NativeLibraries'
  
  - task: PowerShell@2
    displayName: Setup metadata
    inputs:
      targetType: 'inline'
      script: |
        $filePath = Resolve-Path "DryWetMidi\Melanchall.DryWetMidi.csproj"
        $xml = New-Object xml
        $xml.PreserveWhitespace = $true
        $xml.Load($filePath)
        
        $version = $xml.Project.PropertyGroup[1].Version
        Write-Host "Current version is $version"
        $newVersion = "$(LibraryVersion)"
        $xml.Project.PropertyGroup[1].Version = $newVersion
        Write-Host "New version: $($xml.Project.PropertyGroup[1].Version)"
        
        Write-Host "Setting release notes up..."
        $xml.Project.PropertyGroup[1].PackageReleaseNotes = "https://github.com/melanchall/drywetmidi/releases/tag/v$(LibraryVersion)"
        Write-Host "Release notes: $($xml.Project.PropertyGroup[1].PackageReleaseNotes)"
        
        Write-Host "Setting copyright up..."
        $xml.Project.PropertyGroup[1].Copyright = "Copyright © Melanchall $((Get-Date).Year)"
        Write-Host "Copyright: $($xml.Project.PropertyGroup[1].Copyright)"
        
        $xml.Save($filePath)
  
  - task: PowerShell@2
    displayName: Setup prerelease version
    condition: not(eq('${{ parameters.prereleaseNumber }}', ''))
    inputs:
      targetType: 'inline'
      script: |
        $filePath = Resolve-Path "DryWetMidi\Melanchall.DryWetMidi.csproj"
        $xml = New-Object xml
        $xml.PreserveWhitespace = $true
        $xml.Load($filePath)
        $version = $xml.Project.PropertyGroup[1].Version
        Write-Host "Current version is $version"
        Write-Host "Prerelease number is ${{ parameters.prereleaseNumber }}"
        $newVersion = $version + "-prerelease" + ${{ parameters.prereleaseNumber }}
        $xml.Project.PropertyGroup[1].Version = $newVersion
        Write-Host "New version: $($xml.Project.PropertyGroup[1].Version)"
        Write-Host "Removing release notes..."
        $xml.Project.PropertyGroup[1].PackageReleaseNotes = ""
        Write-Host "Release notes: $($xml.Project.PropertyGroup[1].PackageReleaseNotes)"
        $xml.Save($filePath)
  
  - template: step-setup-framework.yaml
    parameters:
      framework: 'Net'
  
  - template: step-generate-doc-links.yaml
  
  - template: step-generate-obsolete-api-hints.yaml

  - template: step-generate-platform-specific-api-descriptions.yaml
  
  - ${{ if eq(parameters.packageType, 'Nativeless') }}:  
    - template: step-setup-nativeless-project.yaml
  
  - task: PowerShell@2
    displayName: Set data for LibraryConfiguration
    inputs:
      targetType: 'inline'
      script: |
        $csprojFilePath = Resolve-Path "DryWetMidi\Melanchall.DryWetMidi.csproj"

        Write-Host "Loading version from '$csprojFilePath'..."
        $xml = New-Object xml
        $xml.PreserveWhitespace = $true
        $xml.Load($csprojFilePath)
        $version = $xml.Project.PropertyGroup[1].Version
        Write-Host "Version is '$version'"

        $libraryConfigurationFilePath = Resolve-Path "DryWetMidi\Configuration\LibraryConfiguration.cs"

        Write-Host "Loading LibraryConfiguration content from '$libraryConfigurationFilePath'..."
        $content = Get-Content -Path $libraryConfigurationFilePath -Raw

        Write-Host "Setting version..."
        $content = $content -replace 'Version = UnofficialReleaseMarker', "Version = `"$version`""

        Write-Host "Setting commit ID..."
        $content = $content -replace 'CommitId = UnofficialReleaseMarker', "CommitId = `"$(Build.SourceVersion)`""

        Write-Host "Printing file content:"
        Write-Host "$content"

        Write-Host "Writing content back..."
        Set-Content -Path $libraryConfigurationFilePath -Value $content -NoNewline

        Write-Host "Version successfully inlined."

  - task: PowerShell@2
    displayName: Copy native libraries locally
    condition: eq('${{ parameters.packageType }}', 'Full')
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)/Resources/Scripts/Copy native binaries locally.ps1'
      arguments: '-fromDirectory "$(Pipeline.Workspace)/NativeLibraries"'
      
  - task: DotNetCoreCLI@2
    displayName: Build project
    inputs:
      command: 'build'
      projects: |
        DryWetMidi/Melanchall.DryWetMidi.csproj
      ${{ if eq(parameters.packageType, 'Nativeless') }}:
        arguments: '--configuration $(BuildConfiguration.Nativeless)'
      ${{ else }}:
        arguments: '--configuration $(BuildConfiguration)'
  
  - task: DotNetCoreCLI@2
    displayName: Create NuGet package
    inputs: 
      command: 'pack'
      projects: 'DryWetMidi/Melanchall.DryWetMidi.csproj'
      outputDir: '$(Build.ArtifactStagingDirectory)\NuGetPackage'
      packagesToPack: 'DryWetMidi/Melanchall.DryWetMidi.csproj'
      nobuild: true
      ${{ if eq(parameters.packageType, 'Nativeless') }}:
        configuration: '$(BuildConfiguration.Nativeless)'
      ${{ else }}:
        configuration: '$(BuildConfiguration)'
      buildProperties: 'RepositoryBranch="$(Build.SourceBranchName)'
  
  - task: PublishPipelineArtifact@1
    displayName: Publish 'NuGetPackage' artifact
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)\NuGetPackage'
      artifact: NuGetPackage