parameters:
- name: enabled
  displayName: 'Enabled'
  default: 'false'
- name: portsNames
  displayName: 'Ports names'
  default: 'MIDI A,MIDI B,MIDI C'
  type: string
- name: arch
  displayName: 'Utility architecture'
  default: 'x64'
  type: string

steps:
- task: PowerShell@2
  displayName: Create virtual MIDI ports (Windows)
  condition: and(succeeded(), ${{ parameters.enabled }})
  inputs:
    targetType: filePath
    filePath: '$(Build.SourcesDirectory)/Resources/Scripts/Setup MIDI ports.ps1'
    arguments: '-portsNames "${{ parameters.portsNames }}" -arch "${{ parameters.arch }}"'