parameters:
  enabled: 'false'

steps:
- task: PowerShell@2
  displayName: Install ALSA (Linux)
  condition: and(succeeded(), ${{ parameters.enabled }})
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Installing ALSA development libraries..."
      sudo apt-get update
      sudo apt-get install -y libasound2-dev gcc-aarch64-linux-gnu alsa-utils linux-generic
      
      # Try to install additional kernel module packages
      Write-Host "Attempting to install additional kernel modules..."
      sudo apt-get install -y linux-modules-extra-$(uname -r) 2>&1 || Write-Host "linux-modules-extra not available for this kernel"
      sudo apt-get install -y linux-image-extra-virtual 2>&1 || Write-Host "linux-image-extra-virtual not available"
      
      Write-Host "Loading ALSA sequencer module..."
      sudo modprobe snd-seq 2>&1 || Write-Host "Could not load snd-seq module (expected in cloud VMs)"
      
      # Try loading dummy sound driver
      Write-Host "Loading dummy sound driver..."
      sudo modprobe snd-dummy 2>&1 || Write-Host "Could not load snd-dummy module"
      
      # Create the device manually if it doesn't exist (for testing)
      if (-not (Test-Path "/dev/snd")) {
        Write-Warning "No sound devices available - ALSA sequencer will not work"
        Write-Host "This is expected in Azure VMs without audio hardware"
        Write-Host "Virtual MIDI port tests will be skipped"
      }
      else {
        if (Test-Path "/dev/snd/seq") {
          Write-Host "✓ ALSA sequencer device available: /dev/snd/seq"
          ls -l /dev/snd/seq
          
          # List MIDI clients
          Write-Host "Current ALSA sequencer clients:"
          if (Test-Path "/proc/asound/seq/clients") {
            Get-Content /proc/asound/seq/clients
          }
        }
        else {
          Write-Warning "ALSA sequencer device not available"
          Write-Host "Available sound devices:"
          ls -la /dev/snd/
        }
      }
      
      # Verify module loaded
      $lsmodOutput = lsmod | grep snd
      if ($lsmodOutput) {
        Write-Host "ALSA modules loaded:"
        Write-Host $lsmodOutput
      }
      else {
        Write-Warning "No ALSA modules loaded"
      }

- task: PowerShell@2
  displayName: Build 'LoopbackDevice' app (Linux)
  condition: and(succeeded(), ${{ parameters.enabled }})
  inputs:
    targetType: 'inline'
    script: |
      cd Resources/Utilities/CreateLoopbackPort_Linux
      Write-Host "Building x86_64 app..."
      gcc -o LoopbackDevice_x86_64 LoopbackDevice.c -lasound -pthread
      #Write-Host "Building arm64 app..."
      #aarch64-linux-gnu-gcc -o LoopbackDevice_arm64 LoopbackDevice.c -lasound -pthread
      #Write-Host "Built both architectures successfully"
      file LoopbackDevice_x86_64
      #file LoopbackDevice_arm64

