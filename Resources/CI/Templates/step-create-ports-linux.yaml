parameters:
  enabled: 'false'

steps:
- task: PowerShell@2
  displayName: Install ALSA (Linux)
  condition: and(succeeded(), ${{ parameters.enabled }})
  inputs:
    targetType: 'inline'
    script: |
      sudo apt-get update
      sudo apt-get install -y libasound2-dev gcc-aarch64-linux-gnu

      Write-Host "Loading ALSA sequencer module..."
      try {
        sudo modprobe snd-seq
        Write-Host "ALSA sequencer module load command executed"
      }
      catch {
        Write-Host "Failed to load snd-seq module: $_"
      }
      
      # Verify module loaded
      $lsmodOutput = lsmod | grep snd_seq
      if ($lsmodOutput) {
        Write-Host "ALSA sequencer module loaded successfully"
        Write-Host $lsmodOutput
      }
      else {
        Write-Warning "ALSA sequencer module not loaded"
      }
      
      # Check if device exists
      if (Test-Path "/dev/snd/seq") {
        Write-Host "ALSA sequencer device exists: /dev/snd/seq"
        ls -l /dev/snd/seq
      }
      else {
        Write-Error "ALSA sequencer device not found at /dev/snd/seq"
      }
      
      # List MIDI clients
      Write-Host "Current ALSA sequencer clients:"
      if (Test-Path "/proc/asound/seq/clients") {
        Get-Content /proc/asound/seq/clients
      }

- task: PowerShell@2
  displayName: Build 'LoopbackDevice' app (Linux)
  condition: and(succeeded(), ${{ parameters.enabled }})
  inputs:
    targetType: 'inline'
    script: |
      cd Resources/Utilities/CreateLoopbackPort_Linux
      Write-Host "Building x86_64 app..."
      gcc -o LoopbackDevice_x86_64 LoopbackDevice.c -lasound -pthread
      #Write-Host "Building arm64 app..."
      #aarch64-linux-gnu-gcc -o LoopbackDevice_arm64 LoopbackDevice.c -lasound -pthread
      #Write-Host "Built both architectures successfully"
      file LoopbackDevice_x86_64
      #file LoopbackDevice_arm64

