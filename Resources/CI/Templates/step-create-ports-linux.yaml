- task: CmdLine@2
  displayName: Create virtual MIDI ports (Linux)
  condition: and(succeeded(), ${{ parameters.enabled }})
  inputs:
    script: |
      cd Resources/Utilities/CreateLoopbackPort_Linux
      ./LoopbackDevice_x86_64 "MIDI A" "MIDI B" "MIDI C" &